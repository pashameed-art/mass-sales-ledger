<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="description" content="Sales, Purchase (Mydeen) and Profit calculator">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Mass Sales Ledger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:white;padding:18px 16px 20px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{opacity:.75;font-size:12px;margin-top:4px}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#475569}.field input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none}.field input:focus{border-color:#334155}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:#0f172a;color:white}.light{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.total{background:#f8fafc;border-radius:12px;padding:12px}.total small{display:block;color:#64748b;font-size:11px}.total strong{font-size:19px;display:block;margin-top:3px}.profit{color:#047857}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:10px 8px;border-bottom:1px solid #e2e8f0;font-size:13px}th{color:#64748b;font-size:11px}th:first-child,td:first-child{text-align:left}.empty{text-align:center;color:#64748b;padding:25px}.note{font-size:12px;color:#64748b;line-height:1.5}.version{font-size:10px;opacity:.6;text-align:center;padding:10px}.search{margin-bottom:10px}.search input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.install{display:none;margin-top:10px}
@media(max-width:650px){.grid3{grid-template-columns:1fr}.totals{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}h1{font-size:20px}}
</style></head>
<body>
<header><div class="wrap" style="padding:0"><h1>📊 Mass Sales Ledger</h1><div class="sub">Sales • Purchase (Mydeen) • Profit • Total</div><button id="installBtn" class="btn light install">📲 Install App</button></div></header>
<main class="wrap">
<section class="card">
<h3 style="margin-top:0">➕ Add / Edit Entry</h3>
<div class="grid">
<div class="field"><label>Date</label>
<label>Expense<input id="expense" type="number" min="0" step="0.01" value="0"></label><input id="date" type="date"></div>
<div class="field"><label>Sales (₹)</label><input id="sales" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
<div class="field"><label>Purchase – Mydeen (₹)</label><input id="mydeen" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
<div class="field"><label>Profit (Auto)</label><input id="profit" type="number" readonly value="0"></div>
</div>
<div class="actions"><button id="save" class="btn primary">Save Entry</button><button id="cancel" class="btn light" style="display:none">Cancel Edit</button></div>
<p class="note">Profit = Sales − Purchase (Mydeen). Data is saved on this device and works offline.</p>
</section>
<section class="card">
<h3 style="margin-top:0">📌 Total</h3>
<div class="totals"><div class="total"><small>Sales</small><strong id="tSales">₹0</strong></div><div class="total"><small>Purchase (Mydeen)</small><strong id="tMydeen">₹0</strong></div><div class="total"><small>Profit</small><strong id="tProfit" class="profit">₹0</strong></div><div class="total"><small>Entries</small><strong id="tCount">0</strong></div></div>
<div class="actions"><button id="export" class="btn light">⬇️ Export CSV</button><button id="clear" class="btn danger">🗑️ Clear All</button></div>
</section>
<section class="card"><h3 style="margin-top:0">📋 Entries</h3><div class="search"><input id="search" placeholder="Search date..."></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Sales</th><th>Mydeen</th><th>Profit</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="version">Mass Sales Ledger • Version 1.1.0</div>
</main>
<script>
const $=id=>document.getElementById(id);const KEY='mass_sales_ledger_v1';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');let editId=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$('date').value=today();
function calc(){ $('profit').value=Math.max(0,(+$('sales').value||0)-(+$('mydeen').value||0)); }
$('sales').oninput=calc;$('mydeen').oninput=calc;
function save(){let sales=+$('sales').value||0,mydeen=+$('mydeen').value||0,date=$('date').value;if(!date){alert('Date select செய்யவும்');return}if(sales<0||mydeen<0)return;let item={id:editId||Date.now(),date,sales,mydeen,profit:sales-mydeen};if(editId){entries=entries.map(x=>x.id===editId?item:x);editId=null;$('save').textContent='Save Entry';$('cancel').style.display='none'}else entries.push(item);localStorage.setItem(KEY,JSON.stringify(entries));reset();render();}
function reset(){$('date').value=today();$('sales').value='';$('mydeen').value='';$('profit').value=0}
function edit(id){let x=entries.find(e=>e.id===id);if(!x)return;editId=id;$('date').value=x.date;$('sales').value=x.sales;$('mydeen').value=x.mydeen;$('profit').value=x.profit;$('save').textContent='Update Entry';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('இந்த entry-ஐ delete செய்யவா?')){entries=entries.filter(e=>e.id!==id);localStorage.setItem(KEY,JSON.stringify(entries));render()}}
function render(){let q=$('search').value.toLowerCase();let list=entries.filter(x=>x.date.includes(q)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);$('rows').innerHTML=list.length?list.map(x=>`<tr><td>${x.date.split('-').reverse().join('.')}</td><td>${money(x.sales)}</td><td>${money(x.mydeen)}</td><td class="profit">${money(x.profit)}</td><td><button class="btn light" onclick="edit(${x.id})">Edit</button> <button class="btn danger" onclick="del(${x.id})">Delete</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Entries இல்லை</td></tr>`;let s=entries.reduce((a,x)=>a+x.sales,0),m=entries.reduce((a,x)=>a+x.mydeen,0);$('tSales').textContent=money(s);$('tMydeen').textContent=money(m);$('tProfit').textContent=money(s-m);$('tCount').textContent=entries.length}
$('save').onclick=save;$('cancel').onclick=()=>{editId=null;reset();$('save').textContent='Save Entry';$('cancel').style.display='none'};$('search').oninput=render;
$('clear').onclick=()=>{if(entries.length&&confirm('அனைத்து entries-ஐயும் delete செய்யவா?')){entries=[];localStorage.removeItem(KEY);render()}};
$('export').onclick=()=>{let csv='Date,Sales,Purchase Mydeen,Profit\n'+entries.map(x=>`${x.date},${x.sales},${x.mydeen},${x.profit}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mass-sales-ledger.csv';a.click();URL.revokeObjectURL(a.href)};
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBtn').style.display='inline-block'});$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('installBtn').style.display='none'}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));render();
</script></body></html>
